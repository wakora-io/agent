apiVersion: v1
kind: Namespace
metadata:
  name: wakora
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wakora-agent
  namespace: wakora
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wakora-agent-readonly
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wakora-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wakora-agent-readonly
subjects:
  - kind: ServiceAccount
    name: wakora-agent
    namespace: wakora
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wakora-agent
  namespace: wakora
spec:
  selector:
    matchLabels:
      app: wakora-agent
  template:
    metadata:
      labels:
        app: wakora-agent
    spec:
      serviceAccountName: wakora-agent
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists
      initContainers:
        - name: enroll
          image: wakora/agent:latest
          securityContext:
            readOnlyRootFilesystem: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ ! -f /etc/wakora/identity ] && [ -f /var/run/wakora-enroll/teamkey ]; then
                /usr/local/bin/wakora --key "$(cat /var/run/wakora-enroll/teamkey)"
              fi
          volumeMounts:
            - name: config
              mountPath: /etc/wakora
            - name: teamkey
              mountPath: /var/run/wakora-enroll
              readOnly: true
      containers:
        - name: agent
          image: wakora/agent:latest
          securityContext:
            capabilities:
              add: ["SYS_PTRACE"]
          resources:
            limits:
              cpu: 300m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/wakora
            - name: state
              mountPath: /var/lib/wakora
      volumes:
        - name: config
          hostPath:
            path: /etc/wakora
            type: DirectoryOrCreate
        - name: state
          hostPath:
            path: /var/lib/wakora
            type: DirectoryOrCreate
        - name: teamkey
          secret:
            secretName: wakora-key
            optional: true
            items:
              - key: teamkey
                path: teamkey
